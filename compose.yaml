services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-synthetic-only}
    ports: ["127.0.0.1:5438:5432"]
    volumes: ["atlas-db:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas"]
      interval: 3s
      timeout: 3s
      retries: 20
  document-scanner:
    profiles: [documents]
    image: clamav/clamav:1.5.4
    environment:
      CLAMAV_NO_FRESHCLAMD: "true"
    ports: ["127.0.0.1:3311:3310"]
    # Local demonstration uses bundled signatures; freshness is a production gate.
  keycloak:
    profiles: [oidc]
    image: quay.io/keycloak/keycloak:26.8.0
    command: [start-dev, --import-realm]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-synthetic-admin
      KC_HOSTNAME: http://127.0.0.1:8088
    ports: ["127.0.0.1:8088:8080"]
    volumes: ["./infra/keycloak:/opt/keycloak/data/import:ro"]
volumes:
  atlas-db:
