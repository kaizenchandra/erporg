server:
  port: 8080
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      cookie:
        name: JSESSIONID
        http-only: true
        same-site: strict
  tomcat:
    max-http-form-post-size: 32KB
spring:
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
  application:
    name: atlas-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5438/atlas}
    username: ${DB_USER:atlas}
    password: ${DB_PASSWORD:local-synthetic-only}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
atlas:
  talent:
    reminders:
      scheduler-enabled: ${ATLAS_TALENT_REMINDERS_ENABLED:false}
      poll-ms: ${ATLAS_TALENT_REMINDERS_POLL_MS:60000}
